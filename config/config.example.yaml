# config/config.yaml 로 복사해서 쓴다. 매 실행마다 다시 읽는다.

# 과목 별칭. 키는 과목 id 또는 LMS 과목명 전체. 없으면 " | " 앞부분을 쓴다.
course_aliases:
  # 101: OS
  # "운영체제 | 001 분반 (Operating Systems | 001 Section)": 운체

# 학기(term) 이름에 이 문자열이 들어간 과목은 피드에서 뺀다.
exclude_term_keywords:
  - 비교과

# 조회 기간 (오늘 기준 며칠 전 ~ 며칠 후). 공지는 lookback_days 전부터 오늘까지.
lookback_days: 120
lookahead_days: 180

exam:
  # 종료 시각이 없는 시험의 길이(분)
  default_duration_minutes: 60
  # 이 확신도는 [확인필요] 종일 이벤트로 만든다.
  review_confidence:
    - low

alert:
  # 이 횟수만큼 연속 실패하면 알림
  consecutive_failures: 3
